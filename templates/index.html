<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multi-Database Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 30px auto; }
    table { border-collapse: collapse; width: 100%; margin: 15px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #eee; }
    input { margin-right: 5px; }
  </style>
</head>
<body>
  <h1>Multi-Database Manager</h1>

  <label>Database:</label>
  <select id="db-select">
    <option value="jazz">jazz</option>
    <option value="ambient">ambient</option>
    <option value="fusion">fusion</option>
  </select>

  <table>
    <thead>
      <tr><th>ID</th><th>Album</th><th>Artist</th><th>Year</th><th>Actions</th></tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <h3 id="form-title">Add new row</h3>
  <form id="row-form">
    <input id="album" placeholder="Album" required>
    <input id="artist" placeholder="Artist" required>
    <input id="year" type="number" placeholder="Year" required>
    <button type="submit" id="save-button">Add</button>
    <button type="button" id="cancel-button">Cancel</button>
  </form>

  <script>
    // null = lisätään uusi rivi, numero = muokataan sen id:n riviä
    let editId = null;

    function currentDb() {
      return document.getElementById("db-select").value;
    }

    // Hakee valitun tietokannan rivit ja piirtää taulukon
    async function loadRows() {
      const response = await fetch("/api/" + currentDb());
      const data = await response.json();

      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      for (let i = 0; i < data.rows.length; i++) {
        const row = data.rows[i];
        const tr = document.createElement("tr");

        const fields = [row.id, row.album, row.artist, row.year];
        for (let j = 0; j < fields.length; j++) {
          const td = document.createElement("td");
          td.textContent = fields[j];
          tr.appendChild(td);
        }

        const actions = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = function () { startEdit(row); };
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function () { deleteRow(row.id); };
        actions.appendChild(deleteButton);

        tr.appendChild(actions);
        tbody.appendChild(tr);
      }
    }

    // Täyttää lomakkeen rivin nykyisillä arvoilla
    function startEdit(row) {
      editId = row.id;
      document.getElementById("album").value = row.album;
      document.getElementById("artist").value = row.artist;
      document.getElementById("year").value = row.year;
      document.getElementById("form-title").textContent = "Edit row " + row.id;
      document.getElementById("save-button").textContent = "Save";
    }

    // Tyhjentää lomakkeen ja palaa lisäystilaan
    function resetForm() {
      editId = null;
      document.getElementById("row-form").reset();
      document.getElementById("form-title").textContent = "Add new row";
      document.getElementById("save-button").textContent = "Add";
    }

    async function deleteRow(id) {
      await fetch("/api/" + currentDb() + "/" + id, { method: "DELETE" });
      loadRows();
    }

    // Lomakkeen lähetys: POST (lisäys) tai PUT (muokkaus)
    document.getElementById("row-form").onsubmit = async function (event) {
      event.preventDefault();

      const body = {
        album: document.getElementById("album").value,
        artist: document.getElementById("artist").value,
        year: Number(document.getElementById("year").value)
      };

      let url = "/api/" + currentDb();
      let method = "POST";
      if (editId !== null) {
        url = url + "/" + editId;
        method = "PUT";
      }

      await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      resetForm();
      loadRows();
    };

    document.getElementById("cancel-button").onclick = resetForm;

    document.getElementById("db-select").onchange = function () {
      resetForm();
      loadRows();
    };

    loadRows();
  </script>
</body>
</html>
