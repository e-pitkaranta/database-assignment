<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Multi-Database Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 30px auto; }
    table { border-collapse: collapse; width: 100%; margin: 15px 0; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #eee; }
    input { margin-right: 5px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>Multi-Database Manager</h1>

  <label>Database:</label>
  <select id="db-select">
    <option value="employees">employees</option>
    <option value="projects">projects</option>
    <option value="customers">customers</option>
  </select>

  <table>
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>

  <h3 id="form-title">Add new row</h3>
  <form id="row-form">
    <div id="form-fields"></div>
    <button type="submit" id="save-button">Add</button>
    <button type="button" id="cancel-button">Cancel</button>
  </form>

  <script>
    // null = adding a new row, number = editing the row with that id
    let editId = null;
    // columns of the selected database (they come from Flask)
    let columns = [];

    // Returns the name of the selected database
    function currentDb() {
      return document.getElementById("db-select").value;
    }

    // Fetches columns and rows from Flask and draws the table
    async function loadRows() {
      const response = await fetch("/api/" + currentDb());
      const data = await response.json();
      columns = data.columns;

      // header row
      const thead = document.getElementById("table-head");
      thead.innerHTML = "";
      const headRow = document.createElement("tr");
      const headers = ["id"].concat(columns).concat(["actions"]);
      for (let i = 0; i < headers.length; i++) {
        const th = document.createElement("th");
        th.textContent = headers[i];
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);

      // data rows
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      for (let i = 0; i < data.rows.length; i++) {
        const row = data.rows[i];
        const tr = document.createElement("tr");

        const idCell = document.createElement("td");
        idCell.textContent = row.id;
        tr.appendChild(idCell);

        for (let j = 0; j < columns.length; j++) {
          const td = document.createElement("td");
          td.textContent = row[columns[j]];
          tr.appendChild(td);
        }

        const actions = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = function () { startEdit(row); };
        actions.appendChild(editButton);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function () { deleteRow(row.id); };
        actions.appendChild(deleteButton);

        tr.appendChild(actions);
        tbody.appendChild(tr);
      }
    }

    // Creates one input field in the form for each column
    function buildForm() {
      const box = document.getElementById("form-fields");
      box.innerHTML = "";
      for (let i = 0; i < columns.length; i++) {
        const input = document.createElement("input");
        input.id = "field-" + columns[i];
        input.placeholder = columns[i];
        input.required = true;
        box.appendChild(input);
      }
    }

    // Fills the form with the current values of the row
    function startEdit(row) {
      editId = row.id;
      for (let i = 0; i < columns.length; i++) {
        document.getElementById("field-" + columns[i]).value = row[columns[i]];
      }
      document.getElementById("form-title").textContent = "Edit row " + row.id;
      document.getElementById("save-button").textContent = "Save";
    }

    // Clears the form and goes back to add mode
    function resetForm() {
      editId = null;
      document.getElementById("row-form").reset();
      document.getElementById("form-title").textContent = "Add new row";
      document.getElementById("save-button").textContent = "Add";
    }

    // Sends a DELETE request for the row and reloads the table
    async function deleteRow(id) {
      await fetch("/api/" + currentDb() + "/" + id, { method: "DELETE" });
      loadRows();
    }

    // Form submit: POST (add) or PUT (edit)
    document.getElementById("row-form").onsubmit = async function (event) {
      event.preventDefault();

      const body = {};
      for (let i = 0; i < columns.length; i++) {
        body[columns[i]] = document.getElementById("field-" + columns[i]).value;
      }

      let url = "/api/" + currentDb();
      let method = "POST";
      if (editId !== null) {
        url = url + "/" + editId;
        method = "PUT";
      }

      await fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      resetForm();
      loadRows();
    };

    // Changing the database: load rows, build the form for the new columns
    async function changeDb() {
      await loadRows();
      buildForm();
      resetForm();
    }

    document.getElementById("cancel-button").onclick = resetForm;
    document.getElementById("db-select").onchange = changeDb;

    changeDb();  // runs when the page opens
  </script>
</body>
</html>
